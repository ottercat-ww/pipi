<style>
  :root {
    --blue: #060dff;
    --white: #ffffff;
    --line: rgba(255,255,255,.35);
    --line-soft: rgba(255,255,255,.16);
    --mono: "Space Mono", ui-monospace, monospace;
    --sans: Pretendard, "Noto Sans KR", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--blue); color: var(--white); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: inherit; }

  .app {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(340px, 460px);
    grid-template-rows: auto 1fr auto;
    gap: 0 48px; padding: 28px 48px;
    max-width: 1440px; margin: 0 auto;
  }
  .topbar {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    border-bottom: 1px solid var(--line); padding-bottom: 14px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .14em;
  }
  .brand { font-weight: 700; font-size: 14px; letter-spacing: .2em; }
  .status { opacity: .7; display: flex; align-items: center; gap: 8px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--white); opacity: .4; }
  .status.live .dot { opacity: 1; box-shadow: 0 0 0 3px rgba(255,255,255,.2); }

  /* 지도 */
  .map-stage { display: flex; align-items: flex-start; justify-content: center; padding: 24px 0; }
  .map-wrap {
    position: sticky; top: 24px;
    height: min(calc(100vh - 120px), 900px);
    aspect-ratio: 949 / 1195; max-width: 100%;
  }
  .map-image { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  .map-overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hit-area { fill: transparent; stroke: none; cursor: pointer; outline: none; }

  /* 패널 */
  .panel { display: flex; flex-direction: column; gap: 20px; padding: 24px 0; }
  .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; opacity: .7; }
  .panel-head h1 { margin: 10px 0 0; font-size: 38px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
  .panel-head h1 small { display: block; margin-top: 8px; font-size: 14px; font-weight: 400; letter-spacing: 0; opacity: .75; }

  .card { border: 1.5px solid var(--white); border-radius: 16px; padding: 20px 22px 22px; background: rgba(255,255,255,.04); }
  .card-top {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em; opacity: .85;
    border-bottom: 1px dashed var(--line); padding-bottom: 12px; margin-bottom: 16px;
  }

  /* 입력 */
  .label { display: block; font-size: 12px; font-weight: 700; opacity: .7; margin-bottom: 6px; }
  .label .req { font-weight: 400; opacity: .8; }
  .group { margin-bottom: 16px; }
  .text-input, .select {
    width: 100%; height: 44px; padding: 0 14px;
    background: rgba(255,255,255,.06); color: var(--white);
    border: 1px solid var(--line); border-radius: 10px; font-size: 15px;
  }
  .text-input::placeholder { color: rgba(255,255,255,.5); }
  .text-input:focus, .select:focus { outline: none; border-color: var(--white); background-color: rgba(255,255,255,.1); }
  .select {
    appearance: none; -webkit-appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%);
    background-position: calc(100% - 20px) 19px, calc(100% - 15px) 19px;
    background-size: 5px 5px; background-repeat: no-repeat;
  }
  .select option { color: #111; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 13px; color: var(--white); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { border-color: var(--white); }
  .chip.is-active { background: var(--white); color: var(--blue); border-color: var(--white); font-weight: 700; }
  .chip:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  .chip .n { font-family: var(--mono); font-size: 10px; opacity: .6; margin-left: 5px; }
  .note { font-size: 13px; line-height: 1.6; opacity: .75; margin: 0 0 16px; }
  .note[hidden] { display: none; }

  .btn-row { display: flex; gap: 8px; }
  .btn {
    flex: 1; border-radius: 999px; padding: 13px 16px; cursor: pointer;
    font-size: 15px; font-weight: 700; letter-spacing: .02em;
    border: 1.5px solid var(--white); transition: transform .1s, background .15s, opacity .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--white); color: var(--blue); }
  .btn-primary:hover { background: rgba(255,255,255,.88); }
  .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
  .btn:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

  /* 결과 */
  .result { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
  .result[hidden] { display: none; }
  .result-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; opacity: .75; margin-bottom: 12px; }
  .log-state { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; white-space: nowrap; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { font-size: 12px; font-weight: 700; opacity: .6; margin-bottom: 4px; }
  .field-value { font-size: 15px; line-height: 1.6; }
  .field-value.strong { font-size: 17px; font-weight: 700; }
  .field-value.pending { opacity: .55; font-style: italic; }
  .rolling .field-value, .rolling .mob-line { opacity: .35; filter: blur(1px); }

  /* 모브 */
  .mob-notice { font-size: 13px; line-height: 1.6; margin: 0; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; opacity: .9; }
  .mob-empty { font-size: 13px; line-height: 1.6; opacity: .7; margin: 0; }
  .mob-empty[hidden], .mob-notice[hidden] { display: none; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; }
  .stepper button { width: 34px; height: 34px; border: none; background: none; color: var(--white); font-size: 16px; cursor: pointer; border-radius: 999px; }
  .stepper button:hover { background: rgba(255,255,255,.1); }
  .stepper output { min-width: 28px; text-align: center; font-family: var(--mono); font-size: 14px; }
  .mob-label { font-size: 14px; opacity: .85; }
  .mob-list { list-style: none; margin: 16px 0 0; padding: 0; counter-reset: m; }
  .mob-list:empty { display: none; }
  .mob-line { counter-increment: m; display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 15px; line-height: 1.5; }
  .mob-line:last-child { border-bottom: none; }
  .mob-line::before { content: counter(m, decimal-leading-zero); font-family: var(--mono); font-size: 11px; opacity: .6; min-width: 20px; }
  .mob-line b { font-weight: 800; }

  .copy-btn { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--white); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .copy-btn:hover { border-color: var(--white); }
  .copy-btn[hidden] { display: none; }

  .footer {
    grid-column: 1 / -1; display: flex; justify-content: space-between;
    border-top: 1px solid var(--line); padding-top: 12px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em; opacity: .7;
  }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--white); color: var(--blue); font-size: 13px; font-weight: 700;
    padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; padding: 16px; gap: 0; }
    .map-stage { padding: 16px 0 8px; }
    .map-wrap { position: static; height: auto; width: 100%; max-width: 520px; }
    .panel { padding: 8px 0 24px; }
    .panel-head h1 { font-size: 30px; }
    .footer { flex-direction: column; gap: 4px; }
  }
</style>
</head>

<script>
(function () {
  const CFG = window.PP_CONFIG;
  const LOG_ON = /^https:\/\/script\.google\.com\/.+\/exec/.test(CFG.LOG_URL || '');

  // 지도 클릭 영역 (570 x 718 기준). keys: 시트 '장소1' 이름 (띄어쓰기 무시)
  const regions = [
    { id:'culture', name:'문화지구',   keys:['문화지구'],             x:304, y:110, w:100, h:48 },
    { id:'resA',    name:'주거지 A',   keys:['주거지a'],              x:162, y:247, w:104, h:48 },
    { id:'medical', name:'의료지구',   keys:['의료지구'],             x:150, y:354, w:104, h:48 },
    { id:'hotel',   name:'호텔',       keys:['호텔','thegrandhotel'], x:265, y:342, w:116, h:38 },
    { id:'plaza',   name:'대공원',     keys:['대공원'],               x:278, y:399, w:90,  h:48 },
    { id:'comA',    name:'상업지구 A', keys:['상업지구a'],            x:414, y:409, w:104, h:48 },
    { id:'comB',    name:'상업지구 B', keys:['상업지구b'],            x:219, y:492, w:104, h:46 },
    { id:'resB',    name:'주거지 B',   keys:['주거지b'],              x:372, y:538, w:104, h:48 },
    { id:'beach',   name:'해변공원',   keys:['해변공원'],             x:153, y:543, w:104, h:46 }
  ];

  /* ───────── 유틸 ───────── */
  const $ = id => document.getElementById(id);
  const norm = s => String(s || '').replace(/\s+/g, '').toLowerCase();
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  function parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c !== '\r') cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    const header = (rows.shift() || []).map(h => h.trim());
    return rows.filter(r => r.some(v => v.trim() !== ''))
      .map(r => Object.fromEntries(header.map((h, i) => [h, (r[i] || '').trim()])));
  }
  function col(obj, prefix) {
    const keys = Object.keys(obj);
    const k = keys.find(k => norm(k) === norm(prefix)) || keys.find(k => norm(k).startsWith(norm(prefix)));
    return k ? obj[k] : '';
  }
  async function loadCSV(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    return parseCSV(await res.text());
  }

  /* ───────── 데이터 ───────── */
  let closedAreas = new Set();
  let missions = [], allMissions = [], mobPool = { size: [], personality: [], race: [] };
  function setMissions(rows) {
    // 장소1 / 장소2 칸이 비어 있으면 (셀 병합 등) 바로 위 행의 값을 이어서 사용
    let prevArea = '', prevPlace = '';
    missions = rows.map(r => {
      let a = col(r, '장소1'), p = col(r, '장소2');
      if (a) { if (a !== prevArea) prevPlace = ''; prevArea = a; } else a = prevArea;
      if (p) prevPlace = p; else p = prevPlace;
      return {
        area: a, place: p, situation: col(r, '봉사활동 상황'), task: col(r, '활동 내용'), reward: col(r, '성공시 보상'),
        open: isOpen(r)
      };
    }).filter(m => m.area && (m.situation || m.task));
    allMissions = missions;
    missions = allMissions.filter(m => m.open && !closedAreas.has(norm(m.area)));
  }

  // 지역 설정 탭: 공개가 체크되지 않은 지역은 닫힘 (탭에 없는 지역은 열림)
  function setAreas(rows) {
    closedAreas = new Set(
      rows.filter(r => col(r, '장소1') && !isOpen(r)).map(r => norm(col(r, '장소1')))
    );
  }

  // '공개' 열이 있으면 체크된 미션만 공개, 열이 없으면 모두 공개
  function isOpen(r) {
    const key = Object.keys(r).find(k => norm(k) === '공개');
    if (!key) return true;
    return ['true', 'o', 'ㅇ', 'y', 'yes', '1', '공개', '✓', '✔'].includes(norm(r[key]));
  }
  function setMobs(rows) {
    const list = key => rows.map(r => col(r, key)).filter(Boolean);
    mobPool = { size: list('크기'), personality: list('성격'), race: list('종족') };
    mobPool.sizeWeights = sizeWeights(rows, mobPool.size);
  }

  // 크기별 가중치 계산
  function sizeWeights(rows, sizes) {
    // 1) 시트에 '크기 비율' 열이 있으면 그 값 사용
    const custom = rows.filter(r => col(r, '크기') && Object.keys(r).some(k => norm(k).startsWith('크기비율')));
    if (custom.length) {
      const key = Object.keys(rows[0]).find(k => norm(k).startsWith('크기비율'));
      const map = {};
      rows.forEach(r => { const s = col(r, '크기'); if (s) map[s] = parseFloat(r[key]); });
      const w = sizes.map(s => (isFinite(map[s]) && map[s] >= 0 ? map[s] : 1));
      if (w.some(x => x > 0)) return w;
    }
    // 2) 기본: 그룹 비율을 그룹 안의 칸 수로 나눠서 배분
    const groups = CFG.SIZE_GROUPS || [];
    const groupOf = s => {
      const n = parseInt(String(s).match(/\d+/) || '', 10);
      return isFinite(n) ? groups.findIndex(g => n >= g.from && n <= g.to) : -1;
    };
    const idx = sizes.map(groupOf);
    const counts = groups.map((_, gi) => idx.filter(i => i === gi).length);
    return idx.map(gi => gi < 0 ? 0 : groups[gi].weight / counts[gi]);
  }

  function pickWeighted(arr, weights) {
    const total = weights.reduce((a, b) => a + b, 0);
    if (!(total > 0)) return pick(arr);
    let r = Math.random() * total;
    for (let i = 0; i < arr.length; i++) { r -= weights[i]; if (r < 0) return arr[i]; }
    return arr[arr.length - 1];
  }

  /* ───────── 상태 ───────── */
  let area = null;   // 선택한 장소1 (null = 아일랜드 전체)
  let place = '';    // 선택한 장소2 ('' = 전체)
  let lastMission = null, lastMobs = [];

  const inArea = (m, r) => !r || r.keys.includes(norm(m.area)) || norm(m.area) === norm(r.name);
  const missionsFor = (r, p) => missions.filter(m => inArea(m, r) && (!p || norm(m.place) === norm(p)));
  const hasAny = r => allMissions.some(m => inArea(m, r));   // 닫힌 미션 포함

  function areaStatus(r) {
    const n = missionsFor(r).length;
    if (n) return ' (' + n + ')';
    return hasAny(r) ? ' (닫힘)' : ' (준비 중)';
  }

  function renderAreaSelect() {
    const sel = $('area-select');
    sel.replaceChildren();
    const opt = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; return o; };
    sel.appendChild(opt('', '아일랜드 전체' + (missions.length ? ' (' + missions.length + ')' : '')));
    regions.forEach(r => {
      sel.appendChild(opt(r.id, r.name + (allMissions.length ? areaStatus(r) : '')));
    });
    sel.value = area ? area.id : '';
  }

  function renderPlaces() {
    const group = $('place-group'), wrap = $('place-chips');
    wrap.replaceChildren();
    const list = missionsFor(area);
    if (!area || !list.length) { group.hidden = true; return; }
    group.hidden = false;
    const places = [...new Set(list.map(m => m.place).filter(Boolean))];
    const make = (value, label, n) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip' + (place === value ? ' is-active' : '');
      b.setAttribute('aria-pressed', place === value ? 'true' : 'false');
      b.append(label);
      const s = document.createElement('span'); s.className = 'n'; s.textContent = n; b.appendChild(s);
      b.addEventListener('click', () => { place = value; hideResult(); render(); });
      return b;
    };
    wrap.appendChild(make('', '전체', list.length));
    places.forEach(p => wrap.appendChild(make(p, p, missionsFor(area, p).length)));
  }

  function render() {
    $('area-select').value = area ? area.id : '';
    renderPlaces();
    const note = $('mission-note');
    if (!allMissions.length) { note.hidden = false; note.textContent = '미션을 불러오는 중이에요.'; }
    else if (!missions.length) { note.hidden = false; note.textContent = '지금은 공개된 미션이 없어요.'; }
    else if (area && !missionsFor(area).length) {
      note.hidden = false;
      note.textContent = hasAny(area) ? '현재 닫혀 있는 구역이에요.' : '이 구역의 미션은 준비 중이에요.';
    }
    else if (!area) { note.hidden = false; note.textContent = '지도에서 구역을 누르거나 장소1을 고르면 장소2도 고를 수 있어요.'; }
    else note.hidden = true;
    updateRollBtn();
  }

  function updateRollBtn() {
    const hasName = $('name-input').value.trim().length > 0;
    const btn = $('roll-mission');
    btn.disabled = !hasName || !missionsFor(area, place).length;
    btn.textContent = hasName ? '미션 추첨' : '이름을 먼저 적어 주세요';
  }

  function hideResult() {
    lastMission = null; lastMobs = [];
    $('mission-result').hidden = true;
    $('copy-mission').hidden = true;
    $('mob-list').replaceChildren();
    $('copy-mob').hidden = true;
    $('mob-notice').hidden = true;
    $('mob-empty').hidden = false;
    $('mob-total').textContent = '';
  }

  function selectArea(region, fromMap) {
    area = region; place = '';
    hideResult(); render();
    if (fromMap && window.matchMedia('(max-width: 900px)').matches) {
      $('mission-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  /* ───────── 추첨 ───────── */
  function shuffleEffect(el, done) {
    el.classList.add('rolling');
    setTimeout(() => { el.classList.remove('rolling'); done(); }, 260);
  }

  async function logDraw(entry) {
    const el = $('r-log');
    if (!LOG_ON) { el.textContent = ''; return; }
    el.textContent = '기록 중…';
    try {
      const res = await fetch(CFG.LOG_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(entry)
      });
      const data = await res.json().catch(() => ({}));
      el.textContent = data.ok ? '기록 완료 ✓' : '기록 실패';
    } catch (e) {
      el.textContent = '기록 확인 불가';
    }
  }

  function rollMission() {
    const name = $('name-input').value.trim();
    const list = missionsFor(area, place);
    if (!name || !list.length) return;
    store.set('pp-name', name);

    let m = pick(list);
    if (list.length > 1) { let n = 0; while (m === lastMission && n++ < 5) m = pick(list); }
    lastMission = m;

    const box = $('mission-result');
    const show = () => {
      $('r-place').textContent = [m.area, m.place].filter(Boolean).join(' / ');
      $('r-situation').textContent = m.situation;
      $('r-task').textContent = m.task;
      const rw = $('r-reward');
      rw.textContent = m.reward || '추가 예정';
      rw.classList.toggle('pending', !m.reward);
      box.hidden = false;
      $('copy-mission').hidden = false;
    };
    box.hidden ? show() : shuffleEffect(box, show);

    const mobs = rollMobs();
    const areaName = m.area || (area ? area.name : '');
    logDraw({
      name, area: areaName, place: m.place, situation: m.situation, task: m.task, reward: m.reward,
      mobs: mobs.map((mb, i) => (i + 1) + '. ' + mobText(mb)).join('\n')
    });
  }

  const mobText = mb => [mb.size, mb.personality, mb.race].filter(Boolean).join(' ');

  function rollMobs() {
    const { size, personality, race } = mobPool;
    if (!race.length) return [];
    const lo = Math.max(1, CFG.MOB_MIN || 1), hi = Math.max(lo, CFG.MOB_MAX || 5);
    const count = lo + Math.floor(Math.random() * (hi - lo + 1));
    lastMobs = Array.from({ length: count }, () => ({
      size: size.length ? pickWeighted(size, mobPool.sizeWeights || []) : '', personality: personality.length ? pick(personality) : '', race: pick(race)
    }));
    const ul = $('mob-list');
    const show = () => {
      ul.replaceChildren(...lastMobs.map(mb => {
        const li = document.createElement('li'); li.className = 'mob-line';
        const span = document.createElement('span');
        span.append([mb.size, mb.personality].filter(Boolean).join(' ') + ' ');
        const b = document.createElement('b'); b.textContent = mb.race; span.appendChild(b);
        li.appendChild(span); return li;
      }));
      $('copy-mob').hidden = false;
      $('mob-empty').hidden = true;
      $('mob-notice').hidden = false;
      $('mob-total').textContent = ' / ' + lastMobs.length + '명';
    };
    ul.children.length ? shuffleEffect(ul, show) : show();
    return lastMobs;
  }

  /* ───────── 복사 ───────── */
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast('복사했어요'); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('복사했어요'); } catch (err) { toast('복사하지 못했어요'); }
      ta.remove();
    }
  }
  $('copy-mission').addEventListener('click', () => {
    const m = lastMission; if (!m) return;
    copy(`[${[m.area, m.place].filter(Boolean).join(' / ')}]\n상황: ${m.situation}\n활동: ${m.task}\n보상: ${m.reward || '추가 예정'}`);
  });
  $('copy-mob').addEventListener('click', () => {
    if (!lastMobs.length) return;
    copy(lastMobs.map((mb, i) => `${i + 1}. ${mobText(mb)}`).join('\n'));
  });

  /* ───────── 이벤트 ───────── */
  $('name-input').value = store.get('pp-name');
  $('name-input').addEventListener('input', updateRollBtn);
  $('area-select').addEventListener('change', e => selectArea(regions.find(r => r.id === e.target.value) || null));
  $('roll-mission').addEventListener('click', rollMission);

  const svgNS = 'http://www.w3.org/2000/svg';
  regions.forEach(region => {
    const r = document.createElementNS(svgNS, 'rect');
    r.setAttribute('x', region.x - region.w / 2); r.setAttribute('y', region.y - region.h / 2);
    r.setAttribute('width', region.w); r.setAttribute('height', region.h);
    r.setAttribute('class', 'hit-area'); r.setAttribute('tabindex', '0'); r.setAttribute('role', 'button');
    r.setAttribute('aria-label', region.name + ' 선택');
    r.addEventListener('click', () => selectArea(region, true));
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectArea(region, true); } });
    $('region-layer').appendChild(r);
  });

  /* ───────── 시작 ───────── */
  renderAreaSelect(); render();
  const areaReq = CFG.SHEET_AREA ? loadCSV(CFG.SHEET_AREA) : Promise.resolve([]);
  Promise.allSettled([loadCSV(CFG.SHEET_MISSION), loadCSV(CFG.SHEET_MOB), areaReq]).then(([m, b, a]) => {
    const okM = m.status === 'fulfilled' && m.value.length;
    const okB = b.status === 'fulfilled' && b.value.length;
    if (a.status === 'fulfilled') setAreas(a.value);
    setMissions(okM ? m.value : window.PP_FALLBACK.missions);
    setMobs(okB ? b.value : window.PP_FALLBACK.mobs);
    $('status').classList.toggle('live', !!(okM && okB));
    $('status-text').textContent = (okM && okB ? 'SHEET LINKED' : 'OFFLINE DATA') + ' / LOG ' + (LOG_ON ? 'ON' : 'OFF');
    $('footer-count').textContent = missions.length + ' MISSIONS / ' + mobPool.race.length + ' RACES';
    renderAreaSelect(); render();
  });
})();
</script>
</body>
</html>
